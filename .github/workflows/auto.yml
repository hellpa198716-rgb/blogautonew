# .github/workflows/auto.yml
name: High-Quality Automated Publisher

on:
  workflow_dispatch:
  schedule:
    # 하루 2회 실행 (UTC 기준 오전 0시, 오후 12시 -> 한국 시간 기준 오전 9시, 밤 10시)
    - cron: '0 0,12 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run high-quality automation script
      env:
        WP_URL: ${{ secrets.WP_URL }}
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
        OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }} # 또는 GEMINI_API_KEY
      run: |
        python main.py

    - name: Commit posted history
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]@users.noreply.github.net"
        git add posted_urls.txt
        git commit -m "chore: update posted article history" || echo "No changes to commit"
        git push

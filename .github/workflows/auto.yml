name: High-Quality Automated Publisher

on:
  workflow_dispatch:
  schedule:
    # 한국 시간(UTC+9) 기준 오전 11시 20분, 오후 8시 20분 실행 (UTC 기준 02:20, 11:20)
    - cron: '20 2 * * *'
    - cron: '20 11 * * *'

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

    - name: Run automation script with Random Delay
      env:
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
        WP_URL: ${{ secrets.WP_URL }}
        WP_USER: ${{ secrets.WP_USER }}
        WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      run: |
        # 검색 피크 타임 내에서 자연스럽게 보이도록 1초~15분(900초) 사이의 무작위 대기 후 실행
        python -c "import time, random; sleep_time = random.randint(1, 900); print(f'Random delay for {sleep_time} seconds...'); time.sleep(sleep_time)"
        python main.py

    - name: Commit posted history
      run: |
        git config --global user.name "github-actions[bot]"
        git config --global user.email "github-actions[bot]"
        git add posted_urls.txt
        git commit -m "chore: update posted article history" || echo "No changes to commit"
        git push
